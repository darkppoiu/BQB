<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 320" width="100%" height="100%">
  <defs>
    <linearGradient id="kingCrown" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe853"/>
      <stop offset="50%" stop-color="#ffbe00"/>
      <stop offset="100%" stop-color="#d67700"/>
    </linearGradient>
    <linearGradient id="kingRobe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2b65d9"/>
      <stop offset="50%" stop-color="#1843a8"/>
      <stop offset="100%" stop-color="#0e2869"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffdfc4"/>
      <stop offset="100%" stop-color="#f5b382"/>
    </linearGradient>
  </defs>

  <g transform="translate(0, 10)">
    <!-- Robe Body -->
    <path d="M 50,300 C 40,200 65,160 100,150 L 200,150 C 235,160 260,200 250,300 Z" fill="url(#kingRobe)" stroke="#0d1b3d" stroke-width="6"/>
    
    <!-- White Arms / Sleeves -->
    <ellipse cx="65" cy="210" rx="35" ry="50" fill="#ffffff" stroke="#0d1b3d" stroke-width="5"/>
    <ellipse cx="235" cy="210" rx="35" ry="50" fill="#ffffff" stroke="#0d1b3d" stroke-width="5"/>

    <!-- Gold Necklace / Collar -->
    <path d="M 95,165 Q 150,210 205,165" fill="none" stroke="#ffbe00" stroke-width="14" stroke-linecap="round"/>
    <path d="M 95,165 Q 150,210 205,165" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
    <!-- Gold Gems on Collar -->
    <rect x="110" y="172" width="12" height="12" fill="#ffbe00" stroke="#000" stroke-width="2" transform="rotate(45 116 178)"/>
    <rect x="144" y="184" width="14" height="14" fill="#ffbe00" stroke="#000" stroke-width="2" transform="rotate(45 151 191)"/>
    <rect x="178" y="172" width="12" height="12" fill="#ffbe00" stroke="#000" stroke-width="2" transform="rotate(45 184 178)"/>

    <!-- Gold Belt Crown Badge -->
    <path d="M 120,240 L 180,240 L 180,285 Q 150,300 120,285 Z" fill="url(#kingCrown)" stroke="#000" stroke-width="4"/>
    <path d="M 130,265 L 130,250 L 140,257 L 150,245 L 160,257 L 170,250 L 170,265 Z" fill="#0d1b3d"/>

    <!-- Head & Face -->
    <ellipse cx="150" cy="115" rx="45" ry="42" fill="url(#skin)" stroke="#000" stroke-width="4"/>

    <!-- Black Beard & Moustache -->
    <path d="M 105,115 C 100,165 130,175 150,175 C 170,175 200,165 195,115 C 190,145 170,165 150,165 C 130,165 110,145 105,115 Z" fill="#1c1d21" stroke="#000" stroke-width="4"/>
    <path d="M 110,125 Q 150,140 190,125 Q 150,155 110,125 Z" fill="#1c1d21" stroke="#000" stroke-width="3"/>

    <!-- Eyes & Eyebrows -->
    <ellipse cx="133" cy="100" rx="6" ry="8" fill="#ffffff" stroke="#000" stroke-width="2"/>
    <circle cx="134" cy="100" r="3" fill="#1c1d21"/>
    <ellipse cx="167" cy="100" rx="6" ry="8" fill="#ffffff" stroke="#000" stroke-width="2"/>
    <circle cx="166" cy="100" r="3" fill="#1c1d21"/>

    <path d="M 122,88 Q 133,82 144,88" fill="none" stroke="#1c1d21" stroke-width="5" stroke-linecap="round"/>
    <path d="M 156,88 Q 167,82 178,88" fill="none" stroke="#1c1d21" stroke-width="5" stroke-linecap="round"/>

    <!-- Nose -->
    <path d="M 144,102 Q 150,112 156,102" fill="url(#skin)" stroke="#000" stroke-width="3"/>

    <!-- Smile / Teeth -->
    <path d="M 132,130 Q 150,144 168,130 Z" fill="#ffffff" stroke="#000" stroke-width="2"/>

    <!-- Golden Crown on Head -->
    <path d="M 105,80 L 100,25 L 122,48 L 150,15 L 178,48 L 200,25 L 195,80 Z" fill="url(#kingCrown)" stroke="#000" stroke-width="4" stroke-linejoin="round"/>
    <rect x="105" y="72" width="90" height="12" rx="3" fill="url(#kingCrown)" stroke="#000" stroke-width="3"/>
    <rect x="143" y="45" width="14" height="14" fill="#007aff" stroke="#000" stroke-width="2" transform="rotate(45 150 52)"/>
    <circle cx="101" cy="24" r="5" fill="#007aff" stroke="#000" stroke-width="2"/>
    <circle cx="199" cy="24" r="5" fill="#007aff" stroke="#000" stroke-width="2"/>
    <circle cx="150" cy="14" r="6" fill="#ff3b30" stroke="#000" stroke-width="2"/>

    <!-- Pointing Hand on Right -->
    <g transform="translate(185, 175)">
      <ellipse cx="25" cy="25" rx="18" ry="14" fill="url(#skin)" stroke="#000" stroke-width="3"/>
      <!-- Index Finger Pointing -->
      <rect x="25" y="16" width="30" height="12" rx="6" fill="url(#skin)" stroke="#000" stroke-width="3"/>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 200" width="100%" height="100%">
  <defs>
    <linearGradient id="textGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff4b0"/>
      <stop offset="30%" stop-color="#ffcc00"/>
      <stop offset="70%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#cc6600"/>
    </linearGradient>
    <linearGradient id="textSilver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e0e6ed"/>
      <stop offset="100%" stop-color="#9aa6b8"/>
    </linearGradient>
    <linearGradient id="shieldBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2b66d9"/>
      <stop offset="50%" stop-color="#1843a8"/>
      <stop offset="100%" stop-color="#0c256b"/>
    </linearGradient>
    <linearGradient id="crownGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe853"/>
      <stop offset="50%" stop-color="#ffbe00"/>
      <stop offset="100%" stop-color="#d67700"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- CLASH Text -->
    <text x="25" y="75" font-family="'__gameFont_4a9947', Impact, Arial-Black, sans-serif" font-size="70" font-weight="900" fill="url(#textSilver)" stroke="#000000" stroke-width="7" stroke-linejoin="round" letter-spacing="2">CLASH</text>

    <!-- ROYALE Text -->
    <text x="25" y="145" font-family="'__gameFont_4a9947', Impact, Arial-Black, sans-serif" font-size="70" font-weight="900" fill="url(#textGold)" stroke="#000000" stroke-width="7" stroke-linejoin="round" letter-spacing="2">ROYALE</text>

    <!-- Shield & Crown Badge on Right -->
    <g transform="translate(305, 30)">
      <!-- Shield Base -->
      <path d="M 10,15 L 90,15 L 90,75 C 90,110 50,140 50,140 C 50,140 10,110 10,75 Z" fill="url(#shieldBlue)" stroke="#ffcc00" stroke-width="6" stroke-linejoin="round"/>
      <!-- Shield Inner Border -->
      <path d="M 18,22 L 82,22 L 82,72 C 82,100 50,126 50,126 C 50,126 18,100 18,72 Z" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
      <!-- Crown on Shield -->
      <path d="M 28,85 L 25,45 L 38,60 L 50,35 L 62,60 L 75,45 L 72,85 Z" fill="url(#crownGold)" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="50" cy="33" r="4" fill="#ff3b30"/>
      <circle cx="25" cy="43" r="3" fill="#34c759"/>
      <circle cx="75" cy="43" r="3" fill="#007aff"/>
      <rect x="28" y="88" width="44" height="8" rx="2" fill="url(#crownGold)" stroke="#000" stroke-width="2"/>
      <polygon points="50,90 53,94 47,94" fill="#ff3b30"/>
    </g>
  </g>
</svg>
